<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Using bootstrap 5 framework-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Here is where your div container(s) will go with your web page content-->

    <div class="container">
      <h1>clothing brand</h1>
      <p>waxed denim .</p>

      <img src="images/design.PNG" class="rounded" alt="waxed denim jeans" />
    </div>
    <div class="container mt-3">
      <h2>Basic Card</h2>
      <div class="card">
        <div class="card-body">Basic card</div>
      </div>
    </div>
    <nav
      id="site-nav"
      class="navbar navbar-expand-sm navbar-dark site-nav"
      role="navigation"
      aria-label="Main navigation"
    >
      <div class="container">
        <!-- No brand/logo -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
          aria-controls="nav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div id="nav" class="collapse navbar-collapse">
          <div class="navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
          </div>
        </div>
      </div>
    </nav>
    <script>
      // Load only the #site-nav element
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
